<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support kit modules</title>
    <!-- Link to your custom stylesheet -->
    <link rel="stylesheet" href="styles.css">
    
    <!-- Local Markdown-it parser library with defer execution flag -->
    <script src="markdown-it.min.js" defer></script>
</head>
<body>

    <!-- Main Navigation Bar -->
    <header class="main-header">
        <div class="header-container">
            <h1>Support kit</h1>
            <p>Choose a path and learn new skills module-by-module.</p>
        </div>
    </header>

    <!-- Search and Filter Control Center (Clean and corrected) -->
    <section class="control-panel">
        <div class="search-wrapper">
            <input 
                type="text" 
                id="searchInput" 
                placeholder="Search for a relevant word in titles or abstracts of modules...minimum 3 letters" 
                aria-label="Search learning modules"
            >
            <button id="resetSearchBtn" class="invisible" title="Clear search filters">✕</button>
        </div>
        
        <!-- Role Selection Button Row -->
        <div class="filter-buttons-wrapper">
            <button class="filter-btn active" data-track="all">Info (All Tracks)</button>
            <button class="filter-btn btn-researcher" data-track="researchers">Researchers</button>
            <button class="filter-btn btn-manager" data-track="managers">Managers</button>
            <button class="filter-btn btn-trainer" data-track="trainers">Trainers</button>
        </div>
        
        <!-- Status indicator text showing dynamic results count -->
        <div id="searchCounter" class="search-counter">Loading track registry index...</div>
    </section>

    <!-- Core Dynamic Content Section -->
    <main class="content-container">
        
        <!-- Target container where app.js will inject the module cards -->
        <div id="articlesContainer" class="modules-grid"></div>

        <!-- Fallback view shown only when zero query results return -->
        <div id="noResults" class="hidden feedback-box">
            <h3>No matching modules found</h3>
            <p>Try adjusting your search terms or clearing the filter to see all structured tracks.</p>
        </div>

        <!-- Pagination Controls wrapper -->
        <div id="loadMoreWrapper" class="hidden pagination-bar">
            <button id="loadMoreBtn" class="primary-btn">Load More Modules ↓</button>
        </div>

    </main>

    <!-- Global Footer -->
    <footer class="main-footer">
        <p>Powered by Markdown-it and GitHub Pages.</p>
    </footer>

    <!-- Load your combined JavaScript file containing Part 1 and Part 2 -->
    <script src="app.js"></script>
</body>
</html>
